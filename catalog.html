                        <div class="apartment-img-placeholder">
                            <img src="${apartment.img}" decoding="async" alt="Планировка" onerror="this.src='img/studio-1.jpg'">
                        </div>
                        <div class="apartment-info-tag">
                            <span class="price-text">от ${apartment.price} ₽</span>
                            <span class="apartment-number">${apartment.number || ''}</span>
                        </div>
                    `;
                    cardCache.set(key, card);
                    grid.appendChild(card);
                    // Плавное появление только для новых карточек (первая отрисовка)
                    setTimeout(() => card.classList.add('visible'), 50);
                } else {
                    // Карточка уже существует и уже загружена — просто переставляем
                    // её в нужное место в DOM (это НЕ вызывает повторную загрузку картинки)
                    grid.appendChild(card);
                }
            });
        }

        function getSortedItems() {
            const items = catalogData[currentType].items.slice();
            if (!currentSort) return items;
            const field = currentSort.field;
            items.sort((a, b) => {
                const diff = parseNumber(a[field]) - parseNumber(b[field]);
                return currentSort.direction === 'desc' ? -diff : diff;
            });
            return items;
        }

        function updateSortButtons() {
            const priceArrow = document.getElementById('sort-price-arrow');
            const areaArrow = document.getElementById('sort-area-arrow');
            const priceBtn = document.getElementById('sort-price-btn');
            const areaBtn = document.getElementById('sort-area-btn');
            priceArrow.textContent = '';
            areaArrow.textContent = '';
            priceBtn.classList.remove('active');
            areaBtn.classList.remove('active');
            if (currentSort) {
                const arrow = currentSort.direction === 'desc' ? '▼' : '▲';
                if (currentSort.field === 'price') {
                    priceArrow.textContent = arrow;
                    priceBtn.classList.add('active');
                } else {
                    areaArrow.textContent = arrow;
                    areaBtn.classList.add('active');
                }
            }
        }

        function toggleSort(field) {
            if (currentSort && currentSort.field === field) {
                // Повторный клик по той же кнопке — меняем направление
                currentSort.direction = currentSort.direction === 'desc' ? 'asc' : 'desc';
            } else {
                // Первый клик — от дорогой/большой к дешёвой/маленькой
                currentSort = { field: field, direction: 'desc' };
            }
            updateSortButtons();
            renderGrid(getSortedItems());
        }

        if (catalogData[currentType]) {
            const data = catalogData[currentType];
            titleElement.innerText = data.title; 
            renderGrid(data.items);
        }
    </script>
</body>
</html>
